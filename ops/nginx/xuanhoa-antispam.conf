# Chống spam form công khai TTPVHCC Xuân Hòa (http context)
# Chỉ tính request POST — GET (đọc bình luận) không bị giới hạn
map $request_method $xh_form_post_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $xh_form_post_key zone=xh_feedback:10m rate=3r/m;
limit_req_zone $xh_form_post_key zone=xh_comments:10m rate=6r/m;

# IP chặn hẳn — spam form + dò /admin ngày 31/10/2026
geo $xh_blocked_ip {
    default         0;
    134.122.189.6   1;
}

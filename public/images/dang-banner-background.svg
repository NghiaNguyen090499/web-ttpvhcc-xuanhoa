  <rect width="1792" height="768" fill="url(#softSpark)"/>

  <path d="M0 0h1792v768H0z" fill="#d60c12" opacity="0.08"/>
  <path d="M-80 520C80 445 235 438 395 510c166 75 328 88 493 15 178-79 340-69 498 26 130 78 266 83 486 7v210H-80Z" fill="#8a080d" opacity="0.16"/>
  <path d="M-40 584c210-87 372-70 522 0 153 72 332 68 480-12 160-86 340-59 505 36 88 50 195 54 365 6v154H-40Z" fill="#ffb11c" opacity="0.12"/>


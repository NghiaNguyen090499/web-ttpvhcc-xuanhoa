<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 768" role="img" aria-label="Đưa Nghị quyết của Đảng vào cuộc sống">
  <defs>
    <linearGradient id="redOrange" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e51012"/>
      <stop offset="0.42" stop-color="#ef2514"/>
      <stop offset="0.72" stop-color="#ff6a12"/>
      <stop offset="1" stop-color="#ff9f17"/>
    </linearGradient>
    <radialGradient id="rightGlow" cx="82%" cy="38%" r="52%">
